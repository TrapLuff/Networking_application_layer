openapi: 3.1.0
info:
  title: Система генерации структуры документов — Прикладной уровень
  version: 0.1.0
  description: HTTP-контракт приёма результатов от транспортного уровня.
servers:
  - url: http://127.0.0.1:3000
    description: Прикладной сервер
paths:
  /api/receive:
    post:
      operationId: receive
      summary: Принять результат от транспортного уровня
      description: |-
        Принимает собранную структуру документа, часть структуры или признак ошибки.
        Поля sender и timestamp передаются из исходного запроса Send.
        Прикладной сервер передаёт результат по SSE только в сессию автора запроса.

        При передаче по частям поля part_number и total_parts указываются вместе.
        Нумерация начинается с 1. Запрос завершается после получения всех уникальных частей.
        Полный результат без номеров частей принимается до получения первой части.
        Ошибка завершает запрос.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiveResult'}
            examples:
              success:
                value:
                  sender: loadjik
                  timestamp: 1760000000123
                  error: false
                  payload: |-
                    1. Введение
                    1.1. Цель и задачи
                    2. Заключение
              failure:
                value: {sender: loadjik, timestamp: 1760000000123, error: true, payload: null}
              part:
                value:
                  sender: loadjik
                  timestamp: 1760000000123
                  error: false
                  part_number: 1
                  total_parts: 2
                  payload: |-
                    1. Введение
                    1.1. Цель и задачи
      responses:
        '200':
          description: Результат принят. Идентичный повтор части активного запроса также возвращает 200.
        '400':
          description: Поля запроса не соответствуют схеме.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '404':
          description: Пара sender и timestamp не соответствует активному запросу.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '409':
          description: Результат конфликтует с уже принятыми частями.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
components:
  schemas:
    ApiError:
      type: object
      required: [message]
      properties:
        message: {type: string}
    ReceiveResult:
      type: object
      required: [sender, timestamp, error, payload]
      properties:
        sender:
          type: string
          minLength: 1
          description: Логин автора из исходного запроса Send.
        timestamp:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Временная метка исходного запроса в миллисекундах Unix.
        error:
          type: boolean
          description: Признак ошибки при обработке запроса.
        payload:
          description: Нумерованный текст структуры или null при ошибке.
        part_number:
          $ref: '#/components/schemas/PartCount'
          description: Номер части. Значение не превышает total_parts.
        total_parts:
          $ref: '#/components/schemas/PartCount'
          description: Общее число частей результата.
      dependentRequired:
        part_number: [total_parts]
        total_parts: [part_number]
      oneOf:
        - properties:
            error: {const: false}
            payload: {type: string, minLength: 1}
        - properties:
            error: {const: true}
            payload: {type: 'null'}
            part_number: false
            total_parts: false
    PartCount:
      type: integer
      minimum: 1
      maximum: 64
